<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行旅 - 动态地球 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 50%, #0c0c1d 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            position: absolute;
            top: 40px;
            text-align: center;
            z-index: 100;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #64b5f6, #42a5f5, #2196f3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(33, 150, 243, 0.5);
        }

        .header p {
            font-size: 1.1rem;
            color: #90caf9;
            opacity: 0.8;
        }

        #container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .control-btn {
            padding: 12px 24px;
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid rgba(33, 150, 243, 0.5);
            color: #90caf9;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(33, 150, 243, 0.4);
            border-color: #64b5f6;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(33, 150, 243, 0.4);
        }

        .info-panel {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            min-width: 280px;
            z-index: 100;
        }

        .info-panel h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #64b5f6;
        }

        .route-item {
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid #2196f3;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .route-item:hover {
            background: rgba(33, 150, 243, 0.2);
            transform: translateX(5px);
        }

        .route-item .city {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .route-item .date {
            font-size: 0.85rem;
            color: #90caf9;
        }

        .stats {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            min-width: 150px;
            text-align: center;
        }

        .stat-item .number {
            font-size: 2rem;
            font-weight: bold;
            color: #64b5f6;
            margin-bottom: 5px;
        }

        .stat-item .label {
            font-size: 0.9rem;
            color: #90caf9;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #64b5f6;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✈️ 行旅足迹</h1>
        <p>探索世界，记录每一段旅程</p>
    </div>

    <div id="container"></div>

    <div class="stats">
        <div class="stat-item">
            <div class="number" id="counter-cities">0</div>
            <div class="label">城市</div>
        </div>
        <div class="stat-item">
            <div class="number" id="counter-countries">0</div>
            <div class="label">国家</div>
        </div>
        <div class="stat-item">
            <div class="number" id="counter-km">0</div>
            <div class="label">公里</div>
        </div>
    </div>

    <div class="info-panel">
        <h3>📍 近期行程</h3>
        <div class="route-item">
            <div class="city">北京 → 巴黎</div>
            <div class="date">2026-03-15</div>
        </div>
        <div class="route-item">
            <div class="city">巴黎 → 东京</div>
            <div class="date">2026-04-20</div>
        </div>
        <div class="route-item">
            <div class="city">东京 → 纽约</div>
            <div class="date">2026-05-10</div>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" onclick="toggleRotation()">⏸️ 暂停旋转</button>
        <button class="control-btn" onclick="resetView()">🔄 重置视角</button>
        <button class="control-btn" onclick="toggleRoutes()">🗺️ 显示航线</button>
    </div>

    <div class="loading" id="loading">Loading Earth...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, globe, atmosphere;
        let rotationEnabled = true;
        let routesVisible = true;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        
        // 旅行数据
        const travelRoutes = [
            { from: { lat: 39.9, lng: 116.4 }, to: { lat: 48.9, lng: 2.3 }, color: 0x64b5f6 },
            { from: { lat: 48.9, lng: 2.3 }, to: { lat: 35.7, lng: 139.7 }, color: 0xf06292 },
            { from: { lat: 35.7, lng: 139.7 }, to: { lat: 40.7, lng: -74.0 }, color: 0xffb74d },
            { from: { lat: 40.7, lng: -74.0 }, to: { lat: -33.9, lng: 151.2 }, color: 0x81c784 },
            { from: { lat: -33.9, lng: 151.2 }, to: { lat: 51.5, lng: -0.1 }, color: 0xba68c8 }
        ];

        const cities = [
            { name: "北京", lat: 39.9, lng: 116.4 },
            { name: "巴黎", lat: 48.9, lng: 2.3 },
            { name: "东京", lat: 35.7, lng: 139.7 },
            { name: "纽约", lat: 40.7, lng: -74.0 },
            { name: "悉尼", lat: -33.9, lng: 151.2 },
            { name: "伦敦", lat: 51.5, lng: -0.1 }
        ];

        function init() {
            // 创建场景
            scene = new THREE.Scene();

            // 创建相机
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 400;

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('container').appendChild(renderer.domElement);

            // 添加环境光
            const ambientLight = new THREE.AmbientLight(0x444444);
            scene.add(ambientLight);

            // 添加定向光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);

            // 创建地球
            createGlobe();
            
            // 创建大气层效果
            createAtmosphere();
            
            // 添加星星背景
            createStars();
            
            // 添加航线
            createRoutes();
            
            // 添加城市标记
            createCityMarkers();

            // 添加鼠标交互
            document.addEventListener('mousemove', onMouseMove, false);
            document.addEventListener('wheel', onMouseWheel, false);
            window.addEventListener('resize', onWindowResize, false);

            // 隐藏加载提示
            document.getElementById('loading').style.display = 'none';

            // 启动计数器动画
            animateCounters();

            // 开始动画循环
            animate();
        }

        function createGlobe() {
            // 地球几何体
            const geometry = new THREE.SphereGeometry(150, 64, 64);
            
            // 创建渐变材质
            const vertexShader = `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;
            
            const fragmentShader = `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    vec3 atmosphere = vec3(0.3, 0.6, 1.0) * intensity;
                    
                    // 地球表面颜色
                    vec3 surfaceColor = mix(
                        vec3(0.05, 0.05, 0.2),
                        vec3(0.1, 0.3, 0.6),
                        intensity
                    );
                    
                    gl_FragColor = vec4(surfaceColor + atmosphere * 0.5, 1.0);
                }
            `;
            
            const material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: true
            });

            globe = new THREE.Mesh(geometry, material);
            scene.add(globe);

            // 添加地球轮廓线
            const wireframe = new THREE.WireframeGeometry(geometry);
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0x4488ff, 
                transparent: true, 
                opacity: 0.1 
            });
            const lines = new THREE.LineSegments(wireframe, lineMaterial);
            globe.add(lines);
        }

        function createAtmosphere() {
            const geometry = new THREE.SphereGeometry(155, 64, 64);
            
            const vertexShader = `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;
            
            const fragmentShader = `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.5 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    vec3 atmosphere = vec3(0.3, 0.6, 1.0) * intensity * 0.5;
                    gl_FragColor = vec4(atmosphere, intensity * 0.5);
                }
            `;
            
            const material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });

            atmosphere = new THREE.Mesh(geometry, material);
            scene.add(atmosphere);
        }

        function createStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 2,
                transparent: true
            });

            const starsVertices = [];
            for (let i = 0; i < 5000; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                starsVertices.push(x, y, z);
            }

            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
        }

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);
            
            return new THREE.Vector3(x, y, z);
        }

        function createRoutes() {
            travelRoutes.forEach(route => {
                const points = [];
                const from = latLngToVector3(route.from.lat, route.from.lng, 151);
                const to = latLngToVector3(route.to.lat, route.to.lng, 151);
                
                // 创建弧线
                const midPoint = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
                midPoint.normalize().multiplyScalar(180);
                
                const curve = new THREE.QuadraticBezierCurve3(from, midPoint, to);
                const points2 = curve.getPoints(50);
                const geometry = new THREE.BufferGeometry().setFromPoints(points2);
                
                const material = new THREE.LineBasicMaterial({ 
                    color: route.color,
                    transparent: true,
                    opacity: 0.6,
                    linewidth: 2
                });
                
                const line = new THREE.Line(geometry, material);
                line.userData = { isRoute: true };
                scene.add(line);

                // 添加流动动画点
                const dotGeometry = new THREE.SphereGeometry(2, 8, 8);
                const dotMaterial = new THREE.MeshBasicMaterial({ 
                    color: route.color,
                    transparent: true,
                    opacity: 0.8
                });
                const dot = new THREE.Mesh(dotGeometry, dotMaterial);
                dot.userData = { curve: curve, progress: Math.random() };
                scene.add(dot);
            });
        }

        function createCityMarkers() {
            cities.forEach(city => {
                const position = latLngToVector3(city.lat, city.lng, 151);
                
                // 创建标记点
                const geometry = new THREE.SphereGeometry(3, 16, 16);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0x64ffda,
                    transparent: true,
                    opacity: 0.8
                });
                const marker = new THREE.Mesh(geometry, material);
                marker.position.copy(position);
                marker.userData = { isMarker: true, cityName: city.name };
                scene.add(marker);

                // 添加脉冲光环
                const ringGeometry = new THREE.RingGeometry(4, 6, 32);
                const ringMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0x64ffda,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.position.copy(position);
                ring.lookAt(new THREE.Vector3(0, 0, 0));
                ring.userData = { isRing: true, initialScale: 1 };
                scene.add(ring);
            });
        }

        function onMouseMove(event) {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseWheel(event) {
            camera.position.z += event.deltaY * 0.1;
            camera.position.z = Math.max(250, Math.min(600, camera.position.z));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animateCounters() {
            const targetCities = 28;
            const targetCountries = 15;
            const targetKm = 125600;
            
            let currentCities = 0;
            let currentCountries = 0;
            let currentKm = 0;
            
            const interval = setInterval(() => {
                currentCities += 1;
                currentCountries += 1;
                currentKm += 2000;
                
                document.getElementById('counter-cities').textContent = currentCities;
                document.getElementById('counter-countries').textContent = currentCountries;
                document.getElementById('counter-km').textContent = (currentKm / 1000).toFixed(0) + 'K';
                
                if (currentCities >= targetCities && currentCountries >= targetCountries && currentKm >= targetKm) {
                    clearInterval(interval);
                }
            }, 50);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (rotationEnabled) {
                globe.rotation.y += 0.002;
                atmosphere.rotation.y += 0.002;
            }

            // 平滑鼠标交互
            targetRotationX = mouseY * 0.05;
            targetRotationY = mouseX * 0.05;
            globe.rotation.x += (targetRotationX - globe.rotation.x) * 0.05;
            globe.rotation.y += (targetRotationY - globe.rotation.y) * 0.05;

            // 动画效果：航线上的流动点
            scene.children.forEach(child => {
                if (child.userData.curve) {
                    child.userData.progress += 0.005;
                    if (child.userData.progress > 1) child.userData.progress = 0;
                    
                    const point = child.userData.curve.getPoint(child.userData.progress);
                    child.position.copy(point);
                }
                
                // 脉冲光环动画
                if (child.userData.isRing) {
                    child.userData.initialScale += 0.02;
                    if (child.userData.initialScale > 2) {
                        child.userData.initialScale = 1;
                    }
                    child.scale.setScalar(child.userData.initialScale);
                    child.material.opacity = 0.3 / child.userData.initialScale;
                }
            });

            renderer.render(scene, camera);
        }

        function toggleRotation() {
            rotationEnabled = !rotationEnabled;
            const btn = document.querySelector('.control-btn');
            btn.textContent = rotationEnabled ? '⏸️ 暂停旋转' : '▶️ 继续旋转';
        }

        function resetView() {
            camera.position.z = 400;
            globe.rotation.x = 0;
            globe.rotation.y = 0;
        }

        function toggleRoutes() {
            routesVisible = !routesVisible;
            scene.children.forEach(child => {
                if (child.userData.isRoute || child.userData.curve) {
                    child.visible = routesVisible;
                }
            });
            const btn = document.querySelectorAll('.control-btn')[2];
            btn.textContent = routesVisible ? '🗺️ 隐藏航线' : '🗺️ 显示航线';
        }

        // 初始化
        init();
    </script>
</body>
</html>
