services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # 代码热挂载：SCP 更新后只需 restart，无需 rebuild
      - /opt/calligraphy-recognition/backend:/app
      # 以下子路径覆盖上面的大挂载（Docker 优先用更具体的挂载）
      - ../backend/data:/app/data
      - ../backend/.env:/app/.env:ro
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
      - /opt/calligraphy-recognition/frontend/dist:/opt/calligraphy-recognition/frontend/dist:ro
      - /opt/calligraphy-recognition/backend/data:/opt/calligraphy-recognition/backend/data:ro

volumes:
  qdrant_data:
  certbot_www:
