services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # 代码热挂载：SCP 更新后只需 restart，无需 rebuild
      - /opt/molin-wiki/backend:/app
      # 以下子路径覆盖上面的大挂载（Docker 优先用更具体的挂载）
      - ../backend/data:/app/data
      - ../backend/.env:/app/.env:ro
    environment:
      # v2.0 §2.3: web 进程不再内嵌 worker 线程，由独立 worker service 消费队列
      TIBA_EMBEDDED_WORKER: "false"
    depends_on:
      qdrant:
        condition: service_started

  # v2.0 §2.3: 独立题跋分析 worker（CV/LLM 重任务与 web 进程隔离）
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    command: ["python", "-m", "app.worker_main"]
    volumes:
      - /opt/molin-wiki/backend:/app
      - ../backend/data:/app/data
      - ../backend/.env:/app/.env:ro
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
      - /opt/molin-wiki/frontend/dist:/opt/molin-wiki/frontend/dist:ro
      - /opt/molin-wiki/backend/data:/opt/molin-wiki/backend/data:ro

volumes:
  qdrant_data:
  certbot_www:
