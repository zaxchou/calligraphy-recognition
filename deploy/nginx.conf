server {
    listen 80;
    server_name xcx.zhouhouhan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name xcx.zhouhouhan.com;
    ssl_certificate /etc/letsencrypt/live/xcx.zhouhouhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcx.zhouhouhan.com/privkey.pem;
    client_max_body_size 30M;

    root /opt/calligraphy-recognition/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location ^~ /static/ {
        alias /opt/calligraphy-recognition/backend/data/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
