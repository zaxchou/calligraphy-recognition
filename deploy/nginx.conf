limit_req_zone $binary_remote_addr zone=vl_api:10m rate=30r/m;

# gzip 压缩（nginx:alpine 默认 #gzip on 是注释掉的，此处必须显式开启）
gzip on;
gzip_comp_level 4;
gzip_min_length 256;
gzip_types text/plain text/css text/javascript application/json application/javascript
           image/svg+xml font/woff2 application/font-woff;
gzip_vary on;
gzip_proxied any;

# TCP 优化
tcp_nopush on;
tcp_nodelay on;

# upstream 后端
upstream backend_upstream {
    server backend:8001;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name molin.wiki www.molin.wiki;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    http2_push_preload on;
    server_name molin.wiki www.molin.wiki;
    ssl_certificate /etc/nginx/ssl/molin.wiki_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/molin.wiki.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 500M;

    root /opt/molin-wiki/frontend/dist;
    index index.html;

    # Video Learner API — same-origin proxy to the local Node service.
    # proxy_buffering off is required for the SSE analysis stream.
    location ^~ /hanson/vl-api/ {
        limit_req zone=vl_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://172.18.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # hanson 子项目 (^~ 优先于 ~* 正则，不走到 SPA try_files)
    location ^~ /hanson/ {
        alias /opt/molin-wiki/frontend/dist/hanson/;
        add_header Cache-Control "no-cache";
    }

    # Ted Selker AI Design Course — study notes viewer
    location ^~ /hanson/tedselkeraidesign/ {
        alias /opt/molin-wiki/frontend/dist/hanson/tedselkeraidesign/;
        add_header Cache-Control "no-cache";
    }

# 静态资源（带 hash，永久缓存）
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 图片
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API 代理（^~ 防止被 .png 等图片正则拦截）
    location ^~ /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # DZI 深度缩放文件
    location ^~ /dzi/ {
        alias /opt/molin-wiki/backend/data/dzi/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 静态文件
    location ^~ /static/ {
        alias /opt/molin-wiki/backend/data/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# === beizitie.com ===
server {
    listen 80;
    server_name beizitie.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# === beizitie.com HTTPS ===
server {
    listen 443 ssl;
    http2 on;
    server_name beizitie.com;
    ssl_certificate /etc/letsencrypt/live/beizitie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beizitie.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_beizitie:5m;
    ssl_session_timeout 1d;
    client_max_body_size 500M;

    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}

