# gzip 压缩
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;
gzip_vary on;
gzip_proxied any;

# upstream 后端（启用 keepalive）
upstream backend_upstream {
    server backend:8001;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name molin.wiki www.molin.wiki;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name molin.wiki www.molin.wiki;
    ssl_certificate /etc/nginx/ssl/molin.wiki_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/molin.wiki.key;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 30M;

    root /opt/molin-wiki/frontend/dist;
    index index.html;

    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 4k;
    }

    location ^~ /static/ {
        alias /opt/molin-wiki/backend/data/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
