<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  /* 墨林百科 GitHub 封面 —— 1280×640，基于 github-cover 模板 */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:640px;overflow:hidden}
  :root{
    /* 品牌邻近色光晕：蜜桃 / 淡朱 / 薰衣草 / 雾蓝 / 淡金 */
    --wash-a:rgba(250,196,150,.40);
    --wash-b:rgba(232,142,110,.24);
    --wash-c:rgba(172,150,228,.26);
    --wash-d:rgba(160,196,242,.22);
    --wash-e:rgba(250,214,150,.30);
    --ink:#2a2420;                    /* 暖调深石墨 */
    --accent:#c96442;                 /* 站点朱砂 */
  }
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);position:relative;
    background:
      radial-gradient(ellipse at 10% -4%, var(--wash-a), transparent 46%),
      radial-gradient(ellipse at 52% -8%, var(--wash-c), transparent 44%),
      radial-gradient(ellipse at 100% 4%,  var(--wash-b), transparent 42%),
      radial-gradient(ellipse at 100% 100%,var(--wash-d), transparent 44%),
      radial-gradient(ellipse at 0% 104%,  var(--wash-e), transparent 40%),
      linear-gradient(180deg,#fbfaf7 0%,#f6f4ef 100%);
  }
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(110,80,50,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(110,80,50,.05) 1px,transparent 1px);
    background-size:40px 40px}

  .brand{position:absolute;left:72px;top:54px;display:flex;align-items:center;gap:13px}
  .brand .seal{width:44px;height:44px;border-radius:8px;transform:rotate(-4deg);
    background:linear-gradient(150deg,#c96442,#9c3a24);display:grid;grid-template-columns:1fr 1fr;
    place-items:center;padding:4px;box-shadow:0 3px 9px rgba(150,48,31,.32)}
  .brand .seal span{font-family:"KaiTi","STKaiti",serif;font-weight:700;font-size:13px;color:#fdf6ea;line-height:1}
  .brand .name{font-size:21px;font-weight:800;letter-spacing:1px}
  .brand .name i{font-style:normal;color:#c96442}

  .t1{position:absolute;left:70px;top:126px;font-size:100px;font-weight:800;color:var(--ink);
      letter-spacing:5px;line-height:1;white-space:nowrap}
  .t2{position:absolute;left:74px;top:246px;font-size:74px;line-height:1.15;white-space:nowrap}
  .t2 .serif{font-family:"Songti SC","SimSun",serif;font-weight:700;letter-spacing:6px;
      background:linear-gradient(transparent 58%, rgba(240,214,170,.85) 58%, rgba(240,214,170,.85) 92%, transparent 92%);
      padding:0 6px}
  .t2 .accent{font-family:"Songti SC","SimSun",serif;font-style:italic;color:var(--accent)}
  .sub{position:absolute;left:76px;top:356px;font-size:18px;letter-spacing:2px;color:#6a6258}
  .chips{position:absolute;left:74px;top:404px;display:flex;gap:13px}
  .chip{font-size:15px;padding:7px 17px;border-radius:15px;letter-spacing:1px;
        border:1px solid transparent;font-weight:500;background:rgba(255,255,255,.72)}
  .chip.p{border-color:rgba(140,120,210,.35);color:#5a4a9e}
  .chip.m{border-color:rgba(90,150,140,.38);color:#2f6e5c}
  .chip.g{border-color:rgba(200,150,60,.38);color:#7a5c18}

  .foot{position:absolute;left:74px;bottom:50px;display:flex;gap:9px;align-items:center}
  .tag{font-size:13px;padding:4px 12px;border-radius:11px;background:var(--ink);color:#f5f2ec;letter-spacing:1px}
  .tag.o{background:rgba(42,36,32,.06);border:1px solid rgba(42,36,32,.15);color:#5c544a}
  .github{position:absolute;left:75px;bottom:16px;font-size:14px;color:#8a8478;letter-spacing:.5px}
  .github b{color:var(--ink)}

  .scene{position:absolute;right:-58px;top:104px;width:640px;height:480px;
         perspective:1500px;perspective-origin:30% 40%}
  .win{width:640px;height:430px;border-radius:14px;overflow:hidden;position:relative;
       background:#fff;border:1px solid rgba(255,255,255,.9);
       transform:rotateX(10deg) rotateY(-13deg) rotate(1.5deg);
       box-shadow:-26px 34px 64px rgba(80,50,30,.16), 0 8px 18px rgba(80,50,30,.07)}
  .win .bar{height:30px;background:#f3f0ea;border-bottom:1px solid rgba(110,80,50,.09);
       display:flex;align-items:center;gap:7px;padding:0 14px}
  .win .bar i{width:10px;height:10px;border-radius:50%}
  .win .bar i:nth-child(1){background:#f0908d}.win .bar i:nth-child(2){background:#f2ce7b}.win .bar i:nth-child(3){background:#93d3a0}
  .win .bar s{text-decoration:none;margin-left:10px;font-size:11px;color:#8a8478;letter-spacing:1px}
  .win img{width:100%;height:calc(100% - 30px);object-fit:cover;object-position:top left;display:block}

  .mini{position:absolute;right:428px;top:428px;width:260px;border-radius:12px;
    background:#332b25;color:#f2ece4;padding:14px 16px;
    transform:rotate(-3deg);
    box-shadow:0 16px 36px rgba(80,50,30,.24), 0 4px 12px rgba(80,50,30,.10);
    font-size:12.5px;letter-spacing:.5px}
  .mini .mt{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .mini .mt b{font-size:13px;color:#fff}
  .mini .mt span{font-size:10px;color:#c9b8a5;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:1px 7px}
  .mini .row{display:flex;gap:6px;flex-wrap:wrap}
  .mini .z{background:rgba(255,255,255,.10);border-radius:7px;padding:3px 7px;font-size:12px;white-space:nowrap}
  .mini .z.on{background:rgba(201,100,66,.38);color:#ffd9c4}

  .spark{position:absolute;left:620px;top:96px;color:#d8916c;font-size:26px;transform:rotate(-8deg)}
  .spark.s2{left:52px;top:470px;font-size:17px;color:#c9a86a}
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="brand">
    <div class="seal"><span>墨</span><span>林</span><span>百</span><span>科</span></div>
    <div class="name">墨林百科 <i>·</i> Molin Wiki</div>
  </div>

  <div class="t1">墨林百科</div>
  <div class="t2"><span class="serif">中国书画</span><span class="accent">× AI</span></div>
  <div class="sub">AI 驱动的中国书画知识平台 · 百科 / 题跋 / 检索 / 地图</div>
  <div class="chips">
    <div class="chip p">艺术家百科</div>
    <div class="chip m">题跋空间分析</div>
    <div class="chip g">行旅气象地图</div>
  </div>
  <div class="spark">✦</div>
  <div class="spark s2">✦</div>

  <div class="scene">
    <div class="win">
      <div class="bar"><i></i><i></i><i></i><s>molin.wiki · 题跋分析</s></div>
      <img src="screenshots/tiba.jpg" alt="">
    </div>
  </div>
  <div class="mini">
    <div class="mt"><b>题跋数据概览</b><span>LIVE</span></div>
    <div class="row">
      <span class="z on">李鱓·410件</span><span class="z">主题6类</span><span class="z">情感3级</span>
    </div>
  </div>

  <div class="foot">
    <div class="tag">v1.0.0</div><div class="tag o">tests passing</div><div class="tag o">MIT License</div>
  </div>
  <div class="github">github.com/<b>zaxchou/molin-wiki</b></div>
</body>
</html>
