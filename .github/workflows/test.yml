name: backend-tests

on:
  push:
    paths: ['backend/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['backend/**']

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install fastapi==0.115.6 sqlalchemy==2.0.23 pydantic==2.10.4 \
            pydantic-settings==2.1.0 python-multipart pillow PyMuPDF \
            opencv-python-headless numpy PyJWT \
            "passlib[bcrypt]" pytest httpx==0.25.2 requests dashscope jieba \
            scipy redis celery==5.3.6 alembic python-dotenv
      - name: Run contract tests
        working-directory: backend
        run: pytest -q
