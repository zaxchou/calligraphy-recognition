name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'deploy/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload backend + deploy to server
        run: |
          tar czf /tmp/deploy.tar.gz backend/ deploy/ --exclude='.git' --exclude='__pycache__' --exclude='*.pyc'
          echo "${{ secrets.SSH_KEY }}" > /tmp/key.pem && chmod 600 /tmp/key.pem
          scp -o StrictHostKeyChecking=no -i /tmp/key.pem /tmp/deploy.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

      - name: Rebuild and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/calligraphy-recognition
            tar xzf /tmp/deploy.tar.gz
            cd deploy
            sudo docker compose up -d --build backend
            sudo docker compose restart nginx
            echo "Deployed at $(date)"
